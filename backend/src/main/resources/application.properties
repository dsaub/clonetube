spring.application.name=clonetube

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
security.jwt.secret=${JWT_SECRET}

aws.sqs.region=${AWS_REGION}
aws.sqs.queue-url=${SQS_QUEUE_URL}
aws.sqs.video-queue-url=${VIDEO_TRANSCODE_QUEUE_URL}

aws.s3.bucket=${AWS_BUCKET_NAME}
aws.s3.endpoint=${S3_ENDPOINT_URL:}
aws.s3.public-endpoint=${S3_PUBLIC_ENDPOINT_URL:}

domain=${DOMAIN}

# Sistema de puntos
points.success-url=${POINTS_SUCCESS_URL:${DOMAIN}/points/success}
points.cancel-url=${POINTS_CANCEL_URL:${DOMAIN}/points/cancel}

# Pasarelas de pago
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.base-url=${STRIPE_BASE_URL:https://api.stripe.com}

paypal.client-id=${PAYPAL_CLIENT_ID:}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
paypal.base-url=${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
