services:
  backend:
    image: ghcr.io/dsaub/clonetube-backend:latest
    environment:
      AWS_REGION: ${AWS_REGION:-eu-west-3}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-clonetube}
      # Endpoint S3/MinIO del backend. Vacío => AWS S3 estándar.
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      # Base pública opcional para servir vídeos públicos (por ejemplo, CloudFront).
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mariadb://mariadb:3306/clonetube}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-clonetube}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-password}
      JWT_SECRET: ${JWT_SECRET:-cambiar-por-clave-segura-de-al-menos-32-byts}
      SQS_QUEUE_URL: ${SQS_QUEUE_URL:-}
      VIDEO_TRANSCODE_QUEUE_URL: ${VIDEO_TRANSCODE_QUEUE_URL:?VIDEO_TRANSCODE_QUEUE_URL is required}
      DOMAIN: ${DOMAIN:-http://localhost}
      POINTS_SUCCESS_URL: ${POINTS_SUCCESS_URL:-${DOMAIN}/points/success}
      POINTS_CANCEL_URL: ${POINTS_CANCEL_URL:-${DOMAIN}/points/cancel}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_BASE_URL: ${STRIPE_BASE_URL:-https://api.stripe.com}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_BASE_URL: ${PAYPAL_BASE_URL:-https://api-m.sandbox.paypal.com}
      OTEL_SERVICE_NAME: clonetube-backend
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS}
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
    restart: unless-stopped

  frontend:
    image: ghcr.io/dsaub/clonetube-frontend:latest
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
