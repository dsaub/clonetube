services:
  backend:
    image: ghcr.io/dsaub/clonetube-backend:latest
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-eu-west-3}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-clonetube}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      # Opcional. Ni la subida ni la reproducción la necesitan: los fragmentos
      # y el vídeo van por /api/v1/video/upload-chunk y /api/v1/video/stream.
      # Sólo afecta a /sign-chunk, que entrega URLs prefirmadas al navegador.
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-cambiar-por-clave-segura-de-al-menos-32-byts}
      SQS_QUEUE_URL: ${SQS_QUEUE_URL:-}
      DOMAIN: ${DOMAIN}
    restart: unless-stopped

  frontend:
    image: ghcr.io/dsaub/clonetube-frontend:latest
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
  worker:
    image: ghcr.io/dsaub/clonetube-worker:latest
    environment:
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      QUEUE_URL: ${SQS_QUEUE_URL}
    depends_on:
      - backend
    restart: unless-stopped
