services:
  backend:
    image: ghcr.io/dsaub/clonetube-backend:latest
    environment:
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-clonetube}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      QUEUE_URL: ${QUEUE_URL}
      # Opcional: el navegador ya no habla con MinIO. Los fragmentos van por
      # /api/v1/video/upload-chunk y el vídeo se sirve por /api/v1/video/stream,
      # así que MinIO puede quedarse en la red interna. Definir esta variable
      # sólo habilita /sign-chunk (subida directa al bucket) y, si apunta a un
      # host que el navegador no alcanza, esa ruta devuelve 404.
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-}
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://clonetube:password@mariadb:3306/clonetube}
      JWT_SECRET: ${JWT_SECRET:-cambiar-por-clave-segura-de-al-menos-32-byts}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      APPSIGNAL_PUSH_API_KEY: ${APPSIGNAL_PUSH_API_KEY}
    restart: unless-stopped

  frontend:
    image: ghcr.io/dsaub/clonetube-frontend:latest
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
  worker:
    image: ghcr.io/dsaub/clonetube-worker:latest
    environment:
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      QUEUE_URL: ${QUEUE_URL}
    depends_on:
      - backend
    restart: unless-stopped
