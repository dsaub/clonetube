services:
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpassword}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-clonetube}
      MARIADB_USER: ${MARIADB_USER:-clonetube}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-password}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-clonetube}
    entrypoint:
      - /bin/sh
      - -c
      - mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD && mc mb --ignore-existing local/$$AWS_BUCKET_NAME

  backend:
    image: ghcr.io/dsaub/clonetube-backend:latest
    depends_on:
      mariadb:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_REGION: ${AWS_REGION:-eu-west-3}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-clonetube}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      # Opcional. Ni la subida ni la reproducción la necesitan: los fragmentos
      # y el vídeo van por /api/v1/video/upload-chunk y /api/v1/video/stream.
      # Sólo afecta a /sign-chunk, que entrega URLs prefirmadas al navegador.
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mariadb://mariadb:3306/clonetube}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-clonetube}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-password}
      JWT_SECRET: ${JWT_SECRET:-cambiar-por-clave-segura-de-al-menos-32-byts}
      SQS_QUEUE_URL: ${SQS_QUEUE_URL:-}
      DOMAIN: ${DOMAIN:-http://localhost}
      POINTS_SUCCESS_URL: ${POINTS_SUCCESS_URL:-${DOMAIN}/points/success}
      POINTS_CANCEL_URL: ${POINTS_CANCEL_URL:-${DOMAIN}/points/cancel}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_BASE_URL: ${STRIPE_BASE_URL:-https://api.stripe.com}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_BASE_URL: ${PAYPAL_BASE_URL:-https://api-m.sandbox.paypal.com}
    restart: unless-stopped

  frontend:
    image: ghcr.io/dsaub/clonetube-frontend:latest
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  worker:
    image: ghcr.io/dsaub/clonetube-worker:latest
    environment:
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      QUEUE_URL: ${SQS_QUEUE_URL}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mariadb_data:
  minio_data:
