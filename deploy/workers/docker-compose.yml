services:
  # ==================================================================
  # OpenTelemetry → Grafana
  # ==================================================================
  # Los workers envían spans directamente al endpoint OTLP de Grafana
  # (Tempo o Grafana Cloud) sin necesidad de un collector intermedio.
  #
  # Configura estas variables en el .env de producción:
  #
  #   # Grafana Cloud (Tempo):
  #   OTEL_EXPORTER_OTLP_ENDPOINT=https://tempo-<instance>.grafana.net:443
  #   OTEL_EXPORTER_OTLP_HEADERS=Authorization=Basic <base64(user:token)>
  #
  #   # Grafana auto-hospedado (Tempo):
  #   OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318
  #
  # Si no se define OTEL_EXPORTER_OTLP_ENDPOINT, los spans no se exportan.
  # ==================================================================

  worker:
    image: ghcr.io/dsaub/clonetube-worker:latest
    environment:
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      QUEUE_URL: ${SQS_QUEUE_URL}
      AWS_REGION: ${AWS_REGION:-eu-west-3}
      # OpenTelemetry
      OTEL_SERVICE_NAME: clonetube-email-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:?Define OTEL_EXPORTER_OTLP_ENDPOINT in .env}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
    restart: unless-stopped

  video-worker:
    image: ghcr.io/dsaub/clonetube-worker:latest
    command: ["python", "video_worker.py"]
    environment:
      VIDEO_QUEUE_URL: ${VIDEO_TRANSCODE_QUEUE_URL}
      AWS_REGION: ${AWS_REGION:-eu-west-3}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-clonetube}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      VISIBILITY_TIMEOUT: ${VIDEO_VISIBILITY_TIMEOUT:-900}
      VISIBILITY_HEARTBEAT_SECONDS: ${VIDEO_VISIBILITY_HEARTBEAT_SECONDS:-60}
      TRANSCODE_TIMEOUT_SECONDS: ${VIDEO_TRANSCODE_TIMEOUT_SECONDS:-21600}
      MAX_VIDEO_BYTES: ${MAX_VIDEO_BYTES:-107374182400}
      # OpenTelemetry
      OTEL_SERVICE_NAME: clonetube-video-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:?Define OTEL_EXPORTER_OTLP_ENDPOINT in .env}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
    stop_grace_period: 30m
    restart: unless-stopped
