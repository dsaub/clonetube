services:
  backend:
    #image: ghcr.io/dsaub/clonetube-backend:latest
    build: backend
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:?AWS_BUCKET_NAME is required}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      # Opcional. Ni la subida ni la reproducción la necesitan: los fragmentos
      # y el vídeo van por /api/v1/video/upload-chunk y /api/v1/video/stream.
      # Sólo afecta a /sign-chunk, que entrega URLs prefirmadas al navegador.
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?SPRING_DATASOURCE_URL is required}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME is required}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:-cambiar-por-clave-segura-de-al-menos-32-byts}
      SQS_QUEUE_URL: ${SQS_QUEUE_URL:-}
      DOMAIN: ${DOMAIN:-http://localhost}
      POINTS_SUCCESS_URL: ${POINTS_SUCCESS_URL:-http://localhost/points/success}
      POINTS_CANCEL_URL: ${POINTS_CANCEL_URL:-http://localhost/points/cancel}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_BASE_URL: ${STRIPE_BASE_URL:-https://api.stripe.com}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_BASE_URL: ${PAYPAL_BASE_URL:-https://api-m.sandbox.paypal.com}
    restart: unless-stopped

  frontend:
    #image: ghcr.io/dsaub/clonetube-frontend:latest
    build: frontend
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
